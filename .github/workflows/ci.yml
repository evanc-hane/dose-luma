name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install lightweight test dependencies
        run: |
          uv venv
          uv pip install \
            "apscheduler>=3.11.3" \
            "cryptography>=48.0.1" \
            "fastapi>=0.110.0" \
            "livekit-api>=1.1.1" \
            "pydantic>=2.6.0" \
            "PyJWT>=2.13.0" \
            "python-dotenv>=1.2.2"
      - name: Run regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run deterministic intent evaluation
        run: .venv/bin/python -m benchmark.intent --output /tmp/results_intent.json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
