name: backend-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked backend and test dependencies
        run: uv sync --locked
      - name: Run regression suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Run deterministic intent evaluation
        run: .venv/bin/python -m benchmark.intent --output /tmp/results_intent.json

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build backend and voice-agent images
        run: docker compose build backend agent
