[project]
name = "dose-luma-backend"
version = "0.1.0"
description = "FastAPI backend for the DoseLuma medication-assistance application"
authors = [
    { name = "Evan Cui", email = "evan.cui1022@gmail.com" },
]
license = "MIT"
keywords = ["machine-learning", "llm", "mlops", "healthcare", "fastapi"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
    "python-multipart>=0.0.32",
    "livekit-api>=1.1.1",
    "cryptography>=48.0.1",
    "pyjwt>=2.13.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
agent = [
    "grpcio!=1.82.0",
    "livekit-agents>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
]
